$kind: http-request
name: Health Check (/health)
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Server health is reported accurately", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
        pm.expect(json.data.status).to.eql("OK");
        pm.expect(json.data).to.have.property("database");
      });
    language: text/javascript
order: 1000
