$kind: http-request
url: "{{baseUrl}}/api/auth/profile"
method: GET
headers:
  Authorization: Bearer {{jobseekerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(json.data.user).to.have.property("email");
      pm.expect(json.data.user.role).to.eql("jobseeker");
    language: text/javascript
order: 6000
