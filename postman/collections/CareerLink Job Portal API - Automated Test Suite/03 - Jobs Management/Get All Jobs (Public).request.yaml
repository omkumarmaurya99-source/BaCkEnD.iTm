$kind: http-request
url: "{{baseUrl}}/api/jobs?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(json.data).to.have.property("jobs");
      pm.expect(json.data).to.have.property("pagination");
    language: text/javascript
order: 2000
