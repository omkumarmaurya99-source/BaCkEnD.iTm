$kind: http-request
url: "{{baseUrl}}/api/jobs/{{createdJobId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(json.data.job._id).to.eql(pm.collectionVariables.get("createdJobId"));
    language: text/javascript
order: 4000
