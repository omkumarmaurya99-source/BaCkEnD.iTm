$kind: http-request
url: "{{baseUrl}}/api/jobs/search?keyword=node"
method: GET
queryParams:
  keyword: node
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(Array.isArray(json.data.jobs)).to.be.true;
    language: text/javascript
order: 3000
