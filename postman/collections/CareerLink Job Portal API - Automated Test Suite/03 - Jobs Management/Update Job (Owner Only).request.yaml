$kind: http-request
url: "{{baseUrl}}/api/jobs/{{createdJobId}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{recruiterToken}}
body:
  type: text
  content: |-
    {
      "title": "Senior Backend Developer - Updated",
      "openings": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(json.data.job.openings).to.eql(3);
    language: text/javascript
order: 6000
