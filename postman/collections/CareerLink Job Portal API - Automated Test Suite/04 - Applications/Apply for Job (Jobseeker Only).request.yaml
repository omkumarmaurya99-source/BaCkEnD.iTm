$kind: http-request
url: "{{baseUrl}}/api/applications"
method: POST
headers:
  Authorization: Bearer {{jobseekerToken}}
body:
  type: formdata
  content:
    - type: text
      key: jobId
      value: "{{createdJobId}}"
    - type: text
      key: coverLetter
      value: I am a strong candidate with relevant experience in Node.js and MongoDB.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Application submitted (201)", function () { pm.response.to.have.status(201); });
      var json = pm.response.json();
      if (json.data && json.data.application) {
        pm.collectionVariables.set("createdApplicationId", json.data.application._id);
      }
    language: text/javascript
order: 1000
