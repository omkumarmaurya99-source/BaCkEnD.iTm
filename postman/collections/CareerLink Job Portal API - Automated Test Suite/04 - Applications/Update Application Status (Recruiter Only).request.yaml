$kind: http-request
url: "{{baseUrl}}/api/applications/{{createdApplicationId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{recruiterToken}}
body:
  type: text
  content: |-
    {
      "status": "shortlisted",
      "notes": "Strong candidate matching required skill profile"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.expect(json.data.application.status).to.eql("shortlisted");
    language: text/javascript
order: 4000
