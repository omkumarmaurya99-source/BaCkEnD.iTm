$kind: http-request
url: "{{baseUrl}}/api/resume/parsed"
method: GET
headers:
  Authorization: Bearer {{jobseekerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Handled gracefully (200 or 404)", function () {
        pm.expect([200, 404]).to.include(pm.response.code);
      });
    language: text/javascript
order: 2000
